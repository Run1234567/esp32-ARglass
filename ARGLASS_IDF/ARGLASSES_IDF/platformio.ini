# =====================================================================
# PlatformIO 项目配置文件
# =====================================================================
# 目标硬件: Seeed XIAO ESP32-S3
# 开发框架: ESP-IDF (原生 C 语言开发，非 Arduino)
# =====================================================================

[env:seeed_xiao_esp32s3]
# ---- 平台与板卡 ----
platform = espressif32           # Espressif 32 平台 (ESP32 系列)
board = seeed_xiao_esp32s3       # Seeed XIAO ESP32-S3 开发板
framework = espidf               # 使用 ESP-IDF 框架 (不是 Arduino)

# ---- 串口监视器配置 ----
monitor_speed = 115200           # 串口监视器波特率 (UART0 日志输出)
monitor_filters = esp32_exception_decoder  # 异常解码器 (崩溃时显示函数名/行号)
monitor_encoding = UTF-8         # UTF-8 编码 (支持中文日志)

# ---- 编译标志 ----
build_flags =
    -D ARDUINO_USB_MODE=1        # USB 模式: 启用 (用于 USB CDC 串口)
    -D ARDUINO_USB_CDC_ON_BOOT=1 # 启动时启用 USB CDC (USB 串口)

# ---- Flash 配置 ----
board_upload.flash_size = 8MB    # Flash 大小:8MB (XIAO ESP32-S3 标配)
board_build.partitions = partitions.csv  # 使用自定义分区表

# ---- CPU 与 Flash 频率 ----
board_build.f_cpu = 240000000L   # CPU 频率: 240MHz (最大)
board_build.f_flash = 80000000L  # Flash 频率: 80MHz(QIO 模式)

# ---- PSRAM 配置 ----
board_build.arduino.memory_type = qio_opi  # PSRAM: QIO/OPI 模式 (八线 PSRAM)
