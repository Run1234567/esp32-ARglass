<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>环境监测 - AR GLASS</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js 时间轴适配器 -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --text-tertiary: rgba(255, 255, 255, 0.3);
            --success-color: #32d74b;
            --danger-color: #ff453a;
            --warning-color: #ffd60a;
            --info-color: #0a84ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg-color);
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-primary);
        }

        /* ========== 极简环境光 ========== */
        .ambient-glow {
            position: fixed;
            top: 20%;
            left: 50%;
            width: 80vw;
            height: 80vw;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        /* ========== 导航栏 ========== */
        .header {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .back-btn:active { background: var(--surface-hover); }
        .back-btn svg { width: 20px; height: 20px; stroke: var(--text-primary); }

        .header-title {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            flex: 1;
            text-align: center;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .status-badge.connected {
            border-color: rgba(50, 215, 75, 0.3);
            background: rgba(50, 215, 75, 0.1);
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--danger-color);
            transition: all 0.3s ease;
        }

        .status-badge.connected .badge-dot {
            background: var(--success-color);
            box-shadow: 0 0 8px rgba(50, 215, 75, 0.6);
        }

        /* ========== 主内容区 ========== */
        .content {
            position: relative;
            z-index: 1;
            padding: 1.5rem;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
            transition: all 0.4s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== 仪表盘卡片 (Apple Health 风格) ========== */
        .sensor-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: transform 0.2s ease, background 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .sensor-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.05);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .sensor-card.updating::after { opacity: 1; transition: opacity 0.1s ease; }

        .card-header { display: flex; align-items: center; gap: 0.8rem; }
        
        .icon-wrapper {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
        }
        
        .light-card .icon-wrapper { color: var(--warning-color); }
        .temp-card .icon-wrapper { color: var(--danger-color); }
        .noise-card .icon-wrapper { color: var(--info-color); }
        .gps-card .icon-wrapper { color: var(--success-color); }
        
        .icon-wrapper svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.5; }

        .card-title { font-size: 0.95rem; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.5px; }
        
        .card-body { display: flex; align-items: baseline; gap: 0.5rem; margin-top: 0.5rem; }
        
        .value-text {
            font-size: 3.5rem;
            font-weight: 300;
            line-height: 1;
            letter-spacing: -1px;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            transition: color 0.3s ease, font-size 0.3s ease;
        }
        
        .unit-text { font-size: 1.2rem; font-weight: 500; color: var(--text-secondary); }
        
        .status-text {
            font-size: 0.8rem;
            color: var(--text-tertiary);
            margin-top: -0.2rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .status-text::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.5;
        }

        /* ========== 历史趋势图表卡片 ========== */
        .chart-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 1.5rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            margin-top: 0.5rem;
            transition: all 0.3s ease;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .chart-title { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }

        .chart-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 3px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .chart-container { position: relative; height: 180px; width: 100%; }
        
        .footer-hint {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.75rem;
            color: var(--text-tertiary);
        }

        .gps-body { display: flex; flex-direction: column; gap: 0.8rem; margin-top: 1rem; }

        /* =========================================
           🖥️ PC 端专属适配 (Media Queries)
           ========================================= */
        @media (min-width: 768px) {
            /* 1. 环境光向中心收束 */
            .ambient-glow {
                width: 50vw;
                height: 50vw;
                top: -10%;
                background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 60%);
            }

            /* 2. 主体加宽并改用 CSS Grid 网格布局 */
            .content {
                padding: 3rem 2rem;
                max-width: 1000px;
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 1.5rem;
            }

            /* 3. 重新规划各卡片占据的列数 */
            .light-card { grid-column: 1 / 2; }
            .temp-card { grid-column: 2 / 3; }
            .noise-card { grid-column: 3 / 4; }

            /* GPS 定位、图表和底部提示独占满 3 列宽度 */
            .gps-card, .chart-card, .footer-hint {
                grid-column: 1 / -1;
            }

            /* GPS内部数据改为横向排列 */
            .gps-card .gps-body {
                flex-direction: row;
                gap: 4rem;
                align-items: center;
            }

            /* 4. PC 端悬停光影反馈 (Hover) */
            .sensor-card:hover, .chart-card:hover {
                transform: translateY(-5px);
                background: rgba(255, 255, 255, 0.08);
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 
                            inset 0 1px 0 rgba(255, 255, 255, 0.1);
            }

            .back-btn:hover { background: rgba(255, 255, 255, 0.1); }
            
            .tab-btn:hover:not(.active) {
                background: rgba(255, 255, 255, 0.08);
                color: var(--text-primary);
            }

            /* 5. 放大桌面端数据字号 */
            .value-text { font-size: 4.5rem; }
            .gps-card .value-text { font-size: 2.5rem !important; }
            .chart-card { margin-top: 0; }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <header class="header">
        <div class="back-btn" id="backBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </div>
        <div class="header-title">环境看板</div>
        <div class="status-badge" id="mqttStatus">
            <div class="badge-dot"></div>
            <span id="mqttText">连接中</span>
        </div>
    </header>

    <main class="content">
        <div class="sensor-card light-card" id="card-light">
            <div class="card-header">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </div>
                <div class="card-title">环境光照度</div>
            </div>
            <div class="card-body">
                <div class="value-text" id="val-light">--</div>
                <div class="unit-text">lx</div>
            </div>
            <div class="status-text" id="status-light">等待数据接入</div>
        </div>

        <div class="sensor-card temp-card" id="card-temp">
            <div class="card-header">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path></svg>
                </div>
                <div class="card-title">设备温度</div>
            </div>
            <div class="card-body">
                <div class="value-text" id="val-temp">--</div>
                <div class="unit-text">°C</div>
            </div>
            <div class="status-text" id="status-temp">等待数据接入</div>
        </div>

        <div class="sensor-card noise-card" id="card-noise">
            <div class="card-header">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg>
                </div>
                <div class="card-title">环境噪音</div>
            </div>
            <div class="card-body">
                <div class="value-text" id="val-noise">--</div>
                <div class="unit-text">dB</div>
            </div>
            <div class="status-text" id="status-noise">等待数据接入</div>
        </div>

        <div class="sensor-card gps-card" id="card-gps">
            <div class="card-header">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                </div>
                <div class="card-title">实时终端定位</div>
            </div>
            <div id="map" style="width: 100%; height: 200px; border-radius: 12px; margin-top: 15px; z-index: 1;"></div>

            <div class="gps-body" style="margin-top: 10px; flex-direction: row; justify-content: space-between;">
                <div style="font-size: 0.8rem; color: var(--text-secondary);">Lat: <span id="val-lat">--</span></div>
                <div style="font-size: 0.8rem; color: var(--text-secondary);">Lng: <span id="val-lng">--</span></div>
            </div>
        </div>

        <div class="chart-card">
            <div class="chart-header">
                <div class="chart-title">实时趋势</div>
                <div class="chart-tabs">
                    <button class="tab-btn active" data-type="light">光照</button>
                    <button class="tab-btn" data-type="temp">温度</button>
                    <button class="tab-btn" data-type="noise">噪音</button>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="historyChart"></canvas>
            </div>
        </div>

        <div class="footer-hint">实时同步 AR 眼镜传感器数据</div>
    </main>

    <script>
        document.getElementById('backBtn').addEventListener('click', () => { window.history.back(); });

        // ==================== 时间格式化工具（东八区） ====================

        function formatTime(dateString) {
            // 如果有传入时间字符串（来自数据库，已是东八区），直接解析
            // 如果没有传入，获取当前东八区时间
            const date = dateString ? new Date(dateString) : new Date();
            return dateString ? new Date(dateString) : new Date();
        }

        // ==================== 数据历史存储逻辑 ====================
        const MAX_DATA_POINTS = 20; // 限制图表显示的数据点数量
        let currentChartType = 'light'; // 当前查看的图表类型

        // 颜色配置，对应主题色
        const CHART_COLORS = {
            light: { border: '#ffd60a', bg: 'rgba(255, 214, 10, 0.15)' },
            temp: { border: '#ff453a', bg: 'rgba(255, 69, 58, 0.15)' },
            noise: { border: '#0a84ff', bg: 'rgba(10, 132, 255, 0.15)' }
        };

        const historyData = {
            labels: Array(MAX_DATA_POINTS).fill(''),
            light: Array(MAX_DATA_POINTS).fill(null),
            temp: Array(MAX_DATA_POINTS).fill(null),
            noise: Array(MAX_DATA_POINTS).fill(null)
        };

        // ==================== 图表初始化 (Chart.js) ====================
        const ctx = document.getElementById('historyChart').getContext('2d');
        const historyChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: historyData.labels,
                datasets: [{
                    data: historyData[currentChartType],
                    borderColor: CHART_COLORS[currentChartType].border,
                    backgroundColor: CHART_COLORS[currentChartType].bg,
                    borderWidth: 2,
                    pointRadius: 0,
                    pointHitRadius: 10,
                    fill: true,
                    tension: 0.4 
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 400, easing: 'easeOutQuart' },
                plugins: { legend: { display: false }, tooltip: { enabled: false } },
                scales: {
                    // 👇 开启 X 轴显示
                    x: {
                        
                        type: 'time',
                        time: {
                            unit: 'second',
                            displayFormats: {
                                second: 'HH:mm:ss',
                                minute: 'HH:mm'
                            },
                            tooltipFormat: 'yyyy-MM-dd HH:mm:ss'
                        },
                        grid: { display: false },
                        ticks: { color: 'rgba(255, 255, 255, 0.4)', font: { size: 10, family: 'system-ui' }, maxTicksLimit: 6 }
                    },
                    y: {
                        display: true, position: 'right', border: { display: false },
                        grid: { color: 'rgba(255, 255, 255, 0.05)', drawTicks: false },
                        ticks: { color: 'rgba(255, 255, 255, 0.3)', font: { size: 10, family: 'system-ui' }, maxTicksLimit: 5 }
                    }
                }
            }
        });

        // ==================== Tab 切换逻辑 ====================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const type = e.target.dataset.type;

                // 切换 Tab 时，从后端拉取该类型的历史数据
                await loadHistoryData(type);

                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                currentChartType = type;
                const ds = historyChart.data.datasets[0];
                ds.data = historyData[currentChartType];
                ds.borderColor = CHART_COLORS[currentChartType].border;
                ds.backgroundColor = CHART_COLORS[currentChartType].bg;

                historyChart.update();
            });
        });

        // ==================== 加载历史数据 ====================
        async function loadHistoryData(type) {
            try {
                const response = await fetch(`/api/get_sensor_history?type=${type}`);
                const res = await response.json();

                if (res.status === 'success' && res.data && res.data.length > 0) {
                    // 👇 提取数值
                    historyData[type] = res.data.map(item => parseFloat(item.value));
                    // 👇 提取并格式化时间作为 X 轴标签
                    historyData.labels = res.data.map(item => formatTime(item.created_at));

                    // 确保数据长度不超过限制
                    if (historyData[type].length > MAX_DATA_POINTS) {
                        historyData[type] = historyData[type].slice(-MAX_DATA_POINTS);
                        historyData.labels = historyData.labels.slice(-MAX_DATA_POINTS);
                    }

                    // 如果当前正在查看这个类型，更新图表
                    if (currentChartType === type) {
                        historyChart.data.labels = historyData.labels; // 更新图表的 X 轴
                        historyChart.data.datasets[0].data = historyData[type];
                        historyChart.update();
                    }

                    console.log(`✅ 已加载 ${type} 历史数据: ${historyData[type].length} 条`);
                }
            } catch (err) {
                console.error("加载历史数据失败:", err);
            }
        }

        // ==================== MQTT 配置 ====================
        const MQTT_BROKER = 'wss://www.runishandsome.asia/mqtt';
        const MQTT_OPTIONS = {
            clientId: 'sensor_' + Math.random().toString(16).substr(2, 8),
            username: 'RUN',
            password: '88888888',
            clean: true
        };
        const TOPICS = {
            light: 'esp32/glass/light',
            temp: 'esp32/glass/temp',
            noise: 'esp32/glass/noise',
            lat: 'esp32/glass/lat',
            lng: 'esp32/glass/lng'
        };

        const mqttStatus = document.getElementById('mqttStatus');
        const mqttText = document.getElementById('mqttText');

        // ==================== 解析数值逻辑 ====================
        function parseValue(str, type) {
            const val = parseFloat(str);
            if (!isNaN(val)) return val.toFixed(1);

            // JSON 格式 {"db":75.2} (noise)
            if (type === 'noise') {
                try {
                    const json = JSON.parse(str);
                    if (json.db !== undefined) {
                        return parseFloat(json.db).toFixed(1);
                    }
                } catch (e) {}
            }
            return null;
        }

        // ==================== 更新数据逻辑 ====================
        function updateSensorData(type, value) {
            const card = document.getElementById(`card-${type}`);
            const valEl = document.getElementById(`val-${type}`);
            const statusEl = document.getElementById(`status-${type}`);

            if (valEl) valEl.textContent = value;

            if (type === 'light') {
                statusEl.textContent = value > 1000 ? '强光环境' : (value < 50 ? '极暗环境' : '光线适宜');
            } else if (type === 'temp') {
                statusEl.textContent = value > 45 ? '设备温度过高' : '运行温度正常';
                statusEl.style.color = value > 45 ? 'var(--danger-color)' : 'var(--text-tertiary)';
            } else if (type === 'noise') {
                statusEl.textContent = value > 80 ? '环境嘈杂' : '环境安静';
            }

            if (card) {
                card.classList.remove('updating');
                void card.offsetWidth;
                card.classList.add('updating');
                setTimeout(() => card.classList.remove('updating'), 300);
            }

            const arr = historyData[type];
            arr.push(parseFloat(value));
            if (arr.length > MAX_DATA_POINTS) arr.shift();

            // 👇 核心改动：如果是当前正在看的图表，把当前最新时间推入 X 轴
            if (currentChartType === type) {
                historyData.labels.push(formatTime());
                if (historyData.labels.length > MAX_DATA_POINTS) {
                    historyData.labels.shift();
                }
                historyChart.update('none'); // 无动画更新，看着更像心电图
            }
        }

        function updateLocation(type, value) {
            const valEl = document.getElementById(`val-${type}`);
            if (valEl) valEl.textContent = parseFloat(value).toFixed(6);

            // 更新全局坐标变量
            if (type === 'lat') currentLat = parseFloat(value);
            if (type === 'lng') currentLng = parseFloat(value);

            // 如果经纬度都拿到了有效值，更新地图位置！
            if (currentLat !== 0 && currentLng !== 0) {
                const newLatLng = [currentLat, currentLng];
                marker.setLatLng(newLatLng); // 移动那个绿色的点
                map.setView(newLatLng);      // 让地图视野跟随点移动
            }

            // 更新卡片动画
            const card = document.getElementById('card-gps');
            if (card) {
                card.classList.remove('updating');
                void card.offsetWidth;
                card.classList.add('updating');
                setTimeout(() => card.classList.remove('updating'), 300);
            }
        }

        // ==================== 终极版地图初始化 ====================
        // 初始化地图，默认中心点设为北京，缩放级别设为 15
        const map = L.map('map', { zoomControl: false }).setView([39.9042, 116.4074], 15);

        // 核心：引入黑色的赛博朋克风地图底图
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // 创建一个好看的标记点 (J.A.R.V.I.S 风格)
        let marker = L.circleMarker([39.9042, 116.4074], {
            color: '#32d74b',      // 边框发光绿
            fillColor: '#32d74b',  // 填充绿
            fillOpacity: 0.5,
            radius: 8
        }).addTo(map);

        // 全局变量保存最新坐标
        let currentLat = 0;
        let currentLng = 0;

        // ==================== MQTT 连接核心 ====================
        function connectMQTT() {
            const client = mqtt.connect(MQTT_BROKER, MQTT_OPTIONS);

            client.on('connect', () => {
                mqttStatus.classList.add('connected');
                mqttText.textContent = '实时同步中';
                Object.values(TOPICS).forEach(topic => client.subscribe(topic));
                console.log('✅ MQTT 已连接');
            });

            client.on('message', (topic, message) => {
                const msgStr = message.toString();
                console.log(`[MQTT] ${topic}: ${msgStr}`);

                // 传感器数据处理
                let type = null;
                if (topic === TOPICS.light) type = 'light';
                else if (topic === TOPICS.temp) type = 'temp';
                else if (topic === TOPICS.noise) type = 'noise';

                if (type) {
                    const value = parseValue(msgStr, type);
                    if (value !== null) {
                        updateSensorData(type, value);
                    }
                }

                // 经纬度数据处理
                if (topic === TOPICS.lat) {
                    updateLocation('lat', msgStr);
                } else if (topic === TOPICS.lng) {
                    updateLocation('lng', msgStr);
                }
            });

            client.on('error', () => {
                mqttStatus.classList.remove('connected');
                mqttText.textContent = '连接失败';
            });

            client.on('offline', () => {
                mqttStatus.classList.remove('connected');
                mqttText.textContent = '离线';
            });

            return client;
        }

        // ==================== 初始化 ====================
        async function init() {
            // 1. 先加载历史数据
            await loadHistoryData('light');
            await loadHistoryData('temp');
            await loadHistoryData('noise');

            // 2. 更新图表显示
            const ds = historyChart.data.datasets[0];
            ds.data = historyData[currentChartType];
            historyChart.update();

            // 3. 连接 MQTT 接收实时数据
            const mqttClient = connectMQTT();
        }

        // 页面加载时执行初始化
        init();
    </script>
</body>
</html>
