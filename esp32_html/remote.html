<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>遥控中枢 - J.A.R.V.I.S</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --text-tertiary: rgba(255, 255, 255, 0.3);
            --success-color: #32d74b;
            --danger-color: #ff453a;
            --warning-color: #ffd60a;
            --info-color: #0a84ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        /* PC端高科技滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        body {
            background: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            color-scheme: dark;
        }

        /* 环境光 */
        .ambient-glow {
            position: fixed; top: 30%; left: 50%; width: 90vw; height: 90vw;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 60%);
            z-index: 0; pointer-events: none; transition: all 0.5s ease;
        }

        /* ========== 头部导航 ========== */
        .header {
            position: sticky; top: 0; left: 0; width: 100%; z-index: 100;
            padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn {
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            background: transparent; border-radius: 50%; cursor: pointer; transition: background 0.3s ease;
        }
        .back-btn:active { background: var(--surface-hover); }
        .back-btn svg { width: 22px; height: 22px; stroke: var(--text-primary); stroke-width: 1.5; }

        .connection-badge {
            display: flex; align-items: center; gap: 6px; padding: 6px 12px;
            background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 30px; font-size: 0.8rem; font-weight: 500;
            transition: all 0.4s ease;
        }
        .connection-badge.connected { border-color: rgba(50, 215, 75, 0.3); background: rgba(50, 215, 75, 0.1); }
        .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--danger-color); transition: background 0.3s ease; }
        .connection-badge.connected .badge-dot { background: var(--success-color); box-shadow: 0 0 8px rgba(50, 215, 75, 0.5); }

        /* ========== 主布局 (Dashboard) ========== */
        .dashboard {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            padding: 2rem 1.5rem 4rem; gap: 3rem; max-width: 1400px; margin: 0 auto;
        }

        /* ----- 左侧：遥控器面板 ----- */
        .panel-remote {
            display: flex; flex-direction: column; align-items: center; gap: 2rem;
            width: 100%; max-width: 340px;
        }

        /* 模式选择器 */
        .mode-selector {
            display: flex; gap: 0.5rem; background: rgba(30, 30, 30, 0.6);
            padding: 0.3rem; border-radius: 12px; border: 1px solid var(--border-color);
        }
        .mode-btn {
            display: flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1.2rem;
            border-radius: 9px; font-size: 0.8rem; font-weight: 500; color: var(--text-secondary);
            cursor: pointer; transition: all 0.3s ease; border: 1px solid transparent;
        }
        .mode-btn.active { color: #fff; background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.15); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .mode-btn svg { width: 16px; height: 16px; stroke: currentColor; }

        /* Apple TV 风触控盘 */
        .remote-wrapper {
            position: relative; width: 280px; height: 280px;
            background: rgba(25, 25, 25, 0.8); border: 1px solid var(--border-color);
            border-radius: 50%; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); overflow: hidden;
            transition: all 0.3s ease;
        }
        .remote-wrapper::before, .remote-wrapper::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.03); z-index: 1; pointer-events: none; }
        .remote-wrapper::before { top: 0; bottom: 0; left: 50%; width: 1px; }
        .remote-wrapper::after { left: 0; right: 0; top: 50%; height: 1px; }

        .direction-btn { position: absolute; width: 50%; height: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s ease; z-index: 2; }
        .direction-btn:active { background: rgba(255, 255, 255, 0.08); }
        .direction-btn svg { width: 22px; height: 22px; stroke: var(--text-secondary); transition: all 0.2s ease; }
        .direction-btn:active svg { stroke: var(--text-primary); transform: scale(1.1); }
        .btn-up { top: 0; left: 25%; width: 50%; align-items: flex-start; padding-top: 25px; }
        .btn-down { bottom: 0; left: 25%; width: 50%; align-items: flex-end; padding-bottom: 25px; }
        .btn-left { left: 0; top: 25%; height: 50%; justify-content: flex-start; padding-left: 25px; }
        .btn-right { right: 0; top: 25%; height: 50%; justify-content: flex-end; padding-right: 25px; }

        .btn-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; background: #1a1a1a; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 20px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .btn-center:active { transform: translate(-50%, -50%) scale(0.92); background: #252525; box-shadow: 0 5px 10px rgba(0,0,0,0.4); }
        .btn-center-icon { font-size: 0.95rem; font-weight: 600; letter-spacing: 1px; color: var(--text-primary); }

        .func-buttons { display: flex; gap: 1.5rem; }
        .func-btn { width: 60px; height: 60px; border-radius: 30px; background: var(--surface-color); border: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; }
        .func-btn:active { transform: scale(0.9); background: var(--surface-hover); }
        .func-btn .icon { font-size: 1.2rem; margin-bottom: 2px; }
        .func-btn .label { font-size: 0.6rem; font-weight: 500; color: var(--text-secondary); }

        /* ----- 右侧：全量应用库 ----- */
        .panel-launcher { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 2rem; }
        
        .launcher-section { display: flex; flex-direction: column; gap: 1rem; }
        .section-title { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); letter-spacing: 1.5px; text-transform: uppercase; margin-left: 0.5rem; }
        
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; }

        .app-btn { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 16px; aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .app-btn:active { transform: scale(0.92); background: var(--surface-hover); }
        
        .app-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.03); }
        .app-icon svg { width: 22px; height: 22px; stroke: var(--text-primary); stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .app-label { font-size: 0.65rem; font-weight: 500; color: var(--text-primary); letter-spacing: 0.5px; }

        /* 状态提示 (Toast) */
        .toast { position: fixed; bottom: 40px; left: 50%; transform: translate(-50%, 20px); background: rgba(40, 40, 40, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; color: #fff; z-index: 1000; opacity: 0; pointer-events: none; transition: all 0.3s ease; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* =========================================
           🖥️ PC 端专属适配 (大视野全开)
           ========================================= */
        @media (min-width: 1024px) {
            .ambient-glow { width: 50vw; height: 50vw; top: 0; }
            .dashboard { flex-direction: row; align-items: flex-start; justify-content: center; gap: 5rem; padding-top: 4rem; }
            .panel-remote { position: sticky; top: 100px; width: 340px; flex-shrink: 0; }
            .panel-launcher { flex-grow: 1; }
            .app-grid { grid-template-columns: repeat(5, 1fr); gap: 1.2rem; }
            .app-btn { border-radius: 20px; }
            
            /* PC 端专属悬停动效 */
            .back-btn:hover { background: rgba(255,255,255,0.1); }
            .mode-btn:hover { background: rgba(255,255,255,0.15); }
            .direction-btn:hover svg { stroke: var(--text-primary); transform: scale(1.15); }
            .btn-center:hover { background: #202020; box-shadow: 0 15px 30px rgba(0,0,0,0.6); }
            .func-btn:hover { transform: translateY(-4px); background: rgba(255,255,255,0.12); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
            
            .app-btn:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); box-shadow: 0 12px 25px rgba(0,0,0,0.4); }
        }

        /* 移动端矮屏幕特调 (iPhone SE等) */
        @media (max-height: 700px) and (max-width: 600px) {
            .remote-wrapper { width: 240px; height: 240px; }
            .btn-center { width: 85px; height: 85px; }
            .panel-remote { gap: 1.5rem; }
        }
    </style>
</head>

    <script>
        // ==================== BLE 配置 ====================
        const BLE_CONFIG = {
            SERVICE_1112_UUID: '00001112-0000-1000-8000-00805f9b34fb',
            CHAR_4444_UUID: '00004444-0000-1000-8000-00805f9b34fb',
            NAME_PREFIX: 'ESP_Web'
        };

        let bleDevice = null, bleServer = null, bleService = null, char4444 = null;
        let isConnected = false;
        let connectionMode = 'mqtt'; // 默认 MQTT 模式

        const connBadge = document.getElementById('connBadge');
        const connText = document.getElementById('connText');
        const modeMqtt = document.getElementById('modeMqtt');
        const modeBle = document.getElementById('modeBle');
        const toast = document.getElementById('toast');

        // ==================== 连接方式切换 ====================
        modeMqtt.addEventListener('click', () => switchMode('mqtt'));
        modeBle.addEventListener('click', () => switchMode('ble'));

        function switchMode(mode) {
            connectionMode = mode;
            modeMqtt.classList.toggle('active', mode === 'mqtt');
            modeBle.classList.toggle('active', mode === 'ble');

            if (mode === 'mqtt') {
                if (mqttClient && mqttClient.connected) {
                    connBadge.classList.add('connected');
                    connText.textContent = 'MQTT 就绪';
                } else {
                    connBadge.classList.remove('connected');
                    connText.textContent = 'MQTT 离线';
                }
            } else {
                if (isConnected) {
                    connBadge.classList.add('connected');
                    connText.textContent = bleDevice ? bleDevice.name : '已连接';
                } else {
                    connBadge.classList.remove('connected');
                    connText.textContent = '未连接蓝牙';
                }
            }
            showToast(`已切换到 ${mode === 'mqtt' ? 'MQTT' : '蓝牙'} 模式`);
        }

        // ==================== 蓝牙连接核心 ====================
        async function connectBLE() {
            try {
                connText.textContent = '正在连接...';
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: BLE_CONFIG.NAME_PREFIX }],
                    optionalServices: [BLE_CONFIG.SERVICE_1112_UUID]
                });
                bleServer = await bleDevice.gatt.connect();
                bleService = await bleServer.getPrimaryService(BLE_CONFIG.SERVICE_1112_UUID);
                char4444 = await bleService.getCharacteristic(BLE_CONFIG.CHAR_4444_UUID);
                isConnected = true;
                
                if (connectionMode === 'ble') {
                    connBadge.classList.add('connected');
                    connText.textContent = bleDevice.name || '已连接';
                }
                showToast('已连接至眼镜 (BLE)');

                bleDevice.addEventListener('gattserverdisconnected', () => {
                    isConnected = false; char4444 = null;
                    if (connectionMode === 'ble') {
                        connBadge.classList.remove('connected');
                        connText.textContent = '蓝牙已断开';
                    }
                    showToast('蓝牙连接已断开');
                });
            } catch (error) {
                connText.textContent = '未连接设备';
                showToast(error.message);
            }
        }

        // ==================== 发送指令核心 ====================
        async function sendCommand(cmd, label = null) {
            if (navigator.vibrate) navigator.vibrate(15);
            
            // UI 反馈
            if (label) showToast(`🚀 已触发：${label}`);
            else showToast(`指令: ${cmd}`);

            if (connectionMode === 'ble') {
                if (!isConnected || !char4444) {
                    await connectBLE();
                    if (!isConnected) return;
                }
                try {
                    const encoder = new TextEncoder();
                    await char4444.writeValue(encoder.encode(cmd));
                } catch (error) {
                    showToast('蓝牙发送失败');
                    if (error.message.includes('GATT') || error.message.includes('disconnect')) {
                        isConnected = false; char4444 = null;
                        connBadge.classList.remove('connected');
                        connText.textContent = '连接丢失';
                    }
                }
            } else {
                if (mqttClient && mqttClient.connected) {
                    mqttClient.publish(MQTT_CONTROL_TOPIC, cmd);
                    console.log(`[MQTT] ${MQTT_CONTROL_TOPIC}: ${cmd}`);
                } else {
                    showToast('⚠️ MQTT 未连接');
                }
            }
        }

        // ==================== 提示 Toast ====================
        let toastTimeout;
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }

        // ==================== 事件绑定 ====================
        // 1. 遥控器十字键 (为了零延迟和顺滑操作，使用 pointerdown)
        const remoteBtns = document.querySelectorAll('.direction-btn, .btn-center, .func-btn');
        remoteBtns.forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                sendCommand(btn.dataset.cmd);
            });
            btn.addEventListener('contextmenu', e => e.preventDefault());
        });

        // 2. APP 启动阵列 (为了防止手机端滑动页面时误触，使用 click)
        const appBtns = document.querySelectorAll('.app-btn');
        appBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const cmd = btn.dataset.cmd;
                const label = btn.querySelector('.app-label').textContent;
                sendCommand(cmd, label);
                
                // 点击下沉动效
                btn.style.transform = 'scale(0.92)';
                setTimeout(() => btn.style.transform = '', 150);
            });
        });

        // ==================== 键盘映射 ====================
        document.addEventListener('keydown', (e) => {
            const keyMap = { 'ArrowUp': 'UP', 'ArrowDown': 'DOWN', 'ArrowLeft': 'LEFT', 'ArrowRight': 'RIGHT', 'Enter': 'OK', ' ': 'OK' };
            const cmd = keyMap[e.key];
            if (cmd) {
                e.preventDefault();
                const btn = document.querySelector(`.remote-wrapper [data-cmd="${cmd}"]`);
                if (btn) {
                    btn.style.transform = btn.classList.contains('btn-center') ? 'translate(-50%, -50%) scale(0.94)' : 'scale(0.95)';
                    setTimeout(() => btn.style.transform = '', 150);
                    sendCommand(cmd);
                }
            }
        });

        if (!navigator.bluetooth) {
            console.warn('当前环境不支持蓝牙 API');
            modeBle.style.opacity = '0.3';
        }

        // ==================== MQTT 初始化 ====================
        const MQTT_BROKER = 'wss://www.runishandsome.asia/mqtt';
        const MQTT_CONTROL_TOPIC = 'esp32/glass/control';

        const mqttClient = mqtt.connect(MQTT_BROKER, {
            clientId: 'web_remote_' + Math.random().toString(16).substr(2, 8),
            username: 'RUN',
            password: '88888888',
            clean: true
        });

        mqttClient.on('connect', () => {
            if (connectionMode === 'mqtt') {
                connBadge.classList.add('connected');
                connText.textContent = 'MQTT 就绪';
            }
        });

        mqttClient.on('error', () => {
            if (connectionMode === 'mqtt') {
                connBadge.classList.remove('connected');
                connText.textContent = 'MQTT 失败';
            }
        });

        mqttClient.on('offline', () => {
            if (connectionMode === 'mqtt') {
                connBadge.classList.remove('connected');
                connText.textContent = 'MQTT 离线';
            }
        });

        switchMode('mqtt');
    </script>
</body>
</html>
