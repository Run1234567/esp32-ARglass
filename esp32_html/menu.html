<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR GLASS - 菜单</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --text-tertiary: rgba(255, 255, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg-color);
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-primary);
        }

        /* ========== 极简环境光 ========== */
        .ambient-glow {
            position: fixed;
            top: -10%;
            left: 50%;
            width: 100vw;
            height: 100vw;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        /* ========== 头部导航 ========== */
        .header {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 1.2rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header-icon:active {
            transform: scale(0.9);
            background: var(--surface-hover);
        }

        .header-icon svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-primary);
        }

        /* ========== 主内容区与网格 ========== */
        .content {
            position: relative;
            z-index: 1;
            padding: 1.5rem;
            max-width: 800px;
            margin: 0 auto;
            transition: all 0.4s ease;
        }

        .section-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 1rem;
            margin-left: 0.2rem;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
            transition: all 0.4s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== Apple风毛玻璃卡片 ========== */
        .card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            cursor: pointer;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease, box-shadow 0.3s ease;
        }

        .card:active {
            transform: scale(0.94);
            background: var(--surface-hover);
        }

        .card-icon {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:active .card-icon {
            background: rgba(255, 255, 255, 0.1);
        }

        .card-icon svg {
            width: 22px;
            height: 22px;
            stroke: var(--text-primary);
            stroke-width: 1.2;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.5px;
            transition: font-size 0.3s ease;
        }

        .card-desc {
            font-size: 0.75rem;
            color: var(--text-secondary);
            line-height: 1.4;
            transition: font-size 0.3s ease;
        }

        /* 跨列的大卡片 */
        .card.full-width {
            grid-column: 1 / -1;
            flex-direction: row;
            align-items: center;
        }

        .card.full-width .card-info {
            flex: 1;
        }

        .card-arrow {
            color: var(--text-tertiary);
            transition: color 0.3s ease, transform 0.3s ease;
        }
        .card-arrow svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 1.5;
        }

        /* ========== 极简弹窗 (默认 Bottom Sheet 风格) ========== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: flex-end; /* 手机端默认底部弹出 */
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 100%;
            max-height: 85vh;
            background: rgba(20, 20, 20, 0.85);
            border-top: 1px solid var(--border-color);
            border-radius: 32px 32px 0 0;
            padding: 1rem 1.5rem 3rem;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            overflow-y: auto;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-drag-handle {
            width: 40px;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            margin: 0 auto 1.5rem;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            background: var(--surface-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        
        .modal-close:active {
            background: rgba(255,255,255,0.1);
        }

        .modal-close svg {
            width: 18px;
            height: 18px;
            stroke: var(--text-primary);
        }

        .modal-body {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* =========================================
           🖥️ PC 端专属适配 (Media Queries)
           当屏幕宽度大于 768px 时，自动触发大屏布局
           ========================================= */
        @media (min-width: 768px) {
            /* 1. 环境光向中心收束，避免糊满大屏 */
            .ambient-glow {
                width: 50vw;
                height: 50vw;
                top: -15%;
                background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 60%);
            }

            /* 2. 页面主体加宽，利用大屏空间 */
            .content {
                padding: 3rem 2rem;
                max-width: 1100px;
            }

            .section-title {
                font-size: 0.9rem;
                margin-bottom: 1.5rem;
                margin-left: 0;
            }

            /* 3. 网格改为 3 列，卡片间距拉大 */
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 1.5rem;
            }

            .card {
                padding: 2rem;
            }

            /* 4. PC 端独占悬停动效 (Hover) */
            .card:hover {
                transform: translateY(-5px);
                background: rgba(255, 255, 255, 0.08);
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 
                            inset 0 1px 0 rgba(255, 255, 255, 0.1);
            }

            .card:hover .card-icon {
                background: rgba(255, 255, 255, 0.12);
                transform: scale(1.05);
            }

            .card.full-width:hover .card-arrow {
                color: var(--text-primary);
                transform: translateX(4px);
            }

            .header-icon:hover {
                background: var(--surface-hover);
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            }

            .card-title {
                font-size: 1.1rem;
            }

            .card-desc {
                font-size: 0.85rem;
            }

            /* 5. 弹窗形态转换：从底部抽出 -> 屏幕居中悬浮 */
            .modal-overlay {
                align-items: center; /* 纵向居中 */
                justify-content: center; /* 横向居中 */
            }

            .modal-content {
                width: 480px;
                max-height: 80vh;
                border: 1px solid var(--border-color);
                border-radius: 28px; /* 变成四面圆角卡片 */
                padding: 2.5rem 3rem 3rem;
                transform: translateY(20px) scale(0.95);
            }

            .modal-overlay.active .modal-content {
                transform: translateY(0) scale(1);
            }

            .modal-drag-handle {
                display: none; /* PC端不需要顶部的下滑把手 */
            }

            .modal-close:hover {
                background: rgba(255, 255, 255, 0.15);
            }
        }
    </style>
</head>

    <script>
        // ==================== 页面内容数据配置 ====================
        const pageData = {
            gallery: {
                title: '空间相册',
                content: '此功能正在开发中。<br><br>未来您可以通过此页面直接预览 AR 眼镜端拍摄的照片和录制的视频片段，并支持无线导出至手机。'
            },
            settings: {
                title: '设备设置',
                content: '此功能正在开发中。<br><br>系统固件版本: v1.0.2<br>硬件版本: Rev A<br><br>待开放功能：亮度调节、空间音效设置、省电模式等。'
            },
            about: {
                title: '关于设备',
                content: 'AR GLASS 控制中心<br>版权所有 © 2026<br><br>致力于提供无缝连接的扩展现实体验。'
            }
        };

        // ==================== DOM 元素 ====================
        const cards = document.querySelectorAll('.card');
        const modalOverlay = document.getElementById('pageModal');
        const modalContent = document.getElementById('modalContent');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // ==================== 弹窗逻辑 ====================
        function openModal(pageId) {
            const data = pageData[pageId];
            if (data) {
                modalTitle.textContent = data.title;
                modalBody.innerHTML = data.content;
                modalOverlay.classList.add('active');
            }
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        // ==================== 事件绑定 ====================
        cards.forEach(card => {
            card.addEventListener('click', (e) => {
                const link = card.dataset.link;
                const pageId = card.dataset.page;

                // 为了点击反馈，延迟一点点跳转
                setTimeout(() => {
                    if (link) {
                        window.location.href = link;
                    } else if (pageId) {
                        openModal(pageId);
                    }
                }, 150);
            });
        });

        closeModalBtn.addEventListener('click', closeModal);
        
        // 点击背景遮罩关闭
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // ==================== 向下滑动关闭逻辑 (iOS 风格) ====================
        let touchStartY = 0;
        let currentY = 0;

        modalContent.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
            modalContent.style.transition = 'none'; // 滑动时取消过渡动画
        }, { passive: true });

        modalContent.addEventListener('touchmove', (e) => {
            currentY = e.touches[0].clientY;
            const diff = currentY - touchStartY;

            // 只有在内容在顶部且向下滑动时才触发容器下移
            if (diff > 0 && modalContent.scrollTop <= 0) {
                modalContent.style.transform = `translateY(${diff}px)`;
            }
        }, { passive: true });

        modalContent.addEventListener('touchend', (e) => {
            modalContent.style.transition = 'transform 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
            const diff = currentY - touchStartY;

            if (diff > 100 && modalContent.scrollTop <= 0) {
                // 滑动距离足够大，关闭弹窗
                closeModal();
                // 恢复位置以便下次打开
                setTimeout(() => {
                    modalContent.style.transform = '';
                }, 400);
            } else {
                // 滑动距离不够，弹回原位
                modalContent.style.transform = 'translateY(0)';
            }
        });
    </script>
</body>
</html>
