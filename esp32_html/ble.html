<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>蓝牙配网 - AR GLASS</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: rgba(255, 255, 255, 0.06);
            --surface-hover: rgba(255, 255, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --text-tertiary: rgba(255, 255, 255, 0.3);
            --primary-action: #ffffff;
            --primary-action-text: #000000;
            --danger-color: #ff453a;
            --success-color: #32d74b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg-color);
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-primary);
        }

        /* ========== 极简环境光 ========== */
        .ambient-glow {
            position: fixed;
            top: 20%;
            left: 50%;
            width: 80vw;
            height: 80vw;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* ========== 导航栏 ========== */
        .header {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .back-btn:active {
            background: var(--surface-hover);
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--text-primary);
        }

        .header-title {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .header-spacer { width: 36px; } /* 用于平衡标题居中 */

        /* ========== 主内容区 ========== */
        .content {
            position: relative;
            z-index: 1;
            padding: 1.5rem;
            padding-bottom: 3rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* ========== 状态卡片 ========== */
        .status-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            margin-bottom: 1.5rem;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            transition: all 0.4s ease;
        }

        .status-icon svg {
            width: 32px;
            height: 32px;
            stroke: currentColor;
            stroke-width: 1.2;
        }

        .status-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
        }

        .status-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* ========== 极简步骤指示器 ========== */
        .steps {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
        }

        .step-dot {
            width: 30px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.15);
            transition: all 0.4s ease;
        }

        .step-dot.active {
            background: var(--text-primary);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .step-dot.done {
            background: var(--text-secondary);
        }

        /* ========== 核心按钮 (Apple Style) ========== */
        .btn-primary {
            width: 100%;
            padding: 1.1rem;
            background: var(--primary-action);
            color: var(--primary-action-text);
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .btn-primary:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.8);
        }

        .btn-primary.disabled, .btn-primary:disabled {
            background: var(--surface-color);
            color: var(--text-secondary);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* 呼吸动画 Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        .btn-primary.disabled .spinner {
            border-color: rgba(255, 255, 255, 0.1);
            border-top-color: #fff;
        }
        .btn-primary.scanning .spinner { display: block; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========== 列表区域 ========== */
        .section {
            margin-bottom: 2rem;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            margin-left: 0.5rem;
        }

        .device-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .device-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.2rem;
            background: transparent;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .device-item:last-child { border-bottom: none; }
        .device-item:active { background: var(--surface-hover); }

        .device-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .device-icon svg { width: 18px; height: 18px; stroke: var(--text-primary); stroke-width: 1.5; }

        .device-info {
            flex: 1;
            min-width: 0;
        }

        .device-name {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 0.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .device-id {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .device-status {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            padding: 0.3rem 0.6rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            transition: all 0.3s;
        }

        .device-item.connected .device-status {
            color: var(--success-color);
            background: rgba(50, 215, 75, 0.1);
        }
        .device-item.connected .device-icon svg { stroke: var(--success-color); }

        /* ========== 提示文案 ========== */
        .hint {
            text-align: center;
            padding: 1rem;
            color: var(--text-tertiary);
            font-size: 0.8rem;
            line-height: 1.6;
        }

        /* ========== 极简弹窗 (iOS Style) ========== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: rgba(30, 30, 30, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2rem 1.5rem 1.5rem;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
        }
        .modal-overlay.show .modal-content { transform: scale(1); }

        .modal-title {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .pwd-input {
            width: 100%;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            color: #fff;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            text-align: center;
        }
        .pwd-input:focus {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .pwd-input::placeholder { color: var(--text-tertiary); }

        .modal-btns { display: flex; gap: 0.8rem; }
        
        .modal-btn {
            flex: 1;
            padding: 0.9rem;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-btn.cancel { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); }
        .modal-btn.confirm { background: var(--text-primary); color: #000; }
        .modal-btn:active { transform: scale(0.95); }

    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <header class="header">
        <div class="back-btn" id="backBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </div>
        <div class="header-title">蓝牙配网</div>
        <div class="header-spacer"></div>
    </header>

    <main class="content">
        <div class="status-card">
            <div class="status-icon" id="statusIcon">
                <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"></polyline>
                </svg>
            </div>
            <div class="status-title" id="statusTitle">准备配网</div>
            <div class="status-desc" id="statusDesc">点击下方按钮扫描附近的眼镜设备</div>
        </div>

        <div class="steps">
            <div class="step-dot active" id="step1"></div>
            <div class="step-dot" id="step2"></div>
            <div class="step-dot" id="step3"></div>
        </div>

        <div class="section" id="scanSection">
            <button class="btn-primary" id="scanBtn">
                <div class="spinner"></div>
                <span id="scanBtnText">扫描设备</span>
            </button>
        </div>

        <div class="section" id="deviceSection" style="display: none;">
            <div class="section-title">可用设备</div>
            <div class="device-list" id="deviceList"></div>
        </div>

        <div class="section" id="wifiSection" style="display: none;">
            <div class="section-title">网络配置</div>
            <button class="btn-primary" id="configBtn">扫描 Wi-Fi</button>
        </div>

        <div class="hint" id="hint">确保手机蓝牙已开启<br>且设备处于可被发现状态</div>

        <div class="modal-overlay" id="passwordModal">
            <div class="modal-content">
                <div class="modal-title" id="modalSsidTitle">连接到 Wi-Fi</div>
                <input type="password" class="pwd-input" id="wifiPassword" placeholder="输入密码">
                <div class="modal-btns">
                    <button class="modal-btn cancel" id="cancelPwdBtn">取消</button>
                    <button class="modal-btn confirm" id="confirmPwdBtn">发送</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ==================== SVG 图标库 (提升质感) ====================
        const ICONS = {
            bluetooth: `<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"></polyline></svg>`,
            search: `<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>`,
            link: `<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>`,
            check: `<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
            x: `<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`,
            device: `<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>`,
            wifi: `<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>`
        };

        // ==================== BLE 配置 (保持不变) ====================
        const BLE_CONFIG = {
            SERVICE_1112_UUID: '00001112-0000-1000-8000-00805f9b34fb',
            CHAR_4444_UUID: '00004444-0000-1000-8000-00805f9b34fb',
            NAME_PREFIX: 'ESP_Web'
        };

        let bleDevice = null;
        let bleServer = null;
        let bleService = null;
        let isConnected = false;
        let char4444 = null;

        // ==================== DOM 元素 ====================
        const backBtn = document.getElementById('backBtn');
        const scanBtn = document.getElementById('scanBtn');
        const scanBtnText = document.getElementById('scanBtnText');
        const deviceSection = document.getElementById('deviceSection');
        const deviceList = document.getElementById('deviceList');
        const wifiSection = document.getElementById('wifiSection');
        const configBtn = document.getElementById('configBtn');
        const statusIcon = document.getElementById('statusIcon');
        const statusTitle = document.getElementById('statusTitle');
        const statusDesc = document.getElementById('statusDesc');
        const hint = document.getElementById('hint');

        const passwordModal = document.getElementById('passwordModal');
        const modalSsidTitle = document.getElementById('modalSsidTitle');
        const wifiPassword = document.getElementById('wifiPassword');
        const cancelPwdBtn = document.getElementById('cancelPwdBtn');
        const confirmPwdBtn = document.getElementById('confirmPwdBtn');
        let selectedSsid = '';

        // ==================== 辅助函数 ====================
        function addWifiItem(ssid, rssi) {
            deviceSection.style.display = 'block';
            if (document.querySelector('.wifi-item') === null) {
                deviceList.innerHTML = '';
            }

            const item = document.createElement('div');
            item.className = 'device-item wifi-item';
            item.innerHTML = `
                <div class="device-icon">${ICONS.wifi}</div>
                <div class="device-info">
                    <div class="device-name">${ssid}</div>
                    <div class="device-id">强度: ${rssi}</div>
                </div>
                <div class="device-status">连接</div>
            `;

            item.addEventListener('click', () => {
                selectedSsid = ssid;
                modalSsidTitle.textContent = `${ssid}`;
                wifiPassword.value = '';
                
                // 优雅显示弹窗
                passwordModal.style.display = 'flex';
                // 触发重绘以播放动画
                passwordModal.offsetHeight; 
                passwordModal.classList.add('show');
            });

            deviceList.appendChild(item);
        }

        function log(msg, type) {
            statusTitle.textContent = msg;
            console.log(`[${type}] ${msg}`);
        }

        // ==================== 返回按钮 ====================
        backBtn.addEventListener('click', () => {
            if (isConnected) disconnectDevice();
            window.history.back();
        });

        // ==================== 扫描设备 ====================
        async function startScan() {
            if (!navigator.bluetooth) {
                alert("当前环境不支持 Web Bluetooth");
                return;
            }

            try {
                scanBtn.classList.add('scanning', 'disabled');
                scanBtnText.textContent = '搜索中...';
                statusIcon.innerHTML = ICONS.search;
                statusTitle.textContent = '正在搜索';
                statusDesc.textContent = '请在弹出的系统对话框中选择设备';
                hint.style.display = 'none';

                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: BLE_CONFIG.NAME_PREFIX }],
                    optionalServices: [BLE_CONFIG.SERVICE_1112_UUID]
                });

                showDevice({
                    name: bleDevice.name || '未知设备',
                    id: '准备配对...'
                });

                scanBtn.classList.remove('scanning', 'disabled');
                scanBtnText.textContent = '重新搜索';

            } catch (error) {
                scanBtn.classList.remove('scanning', 'disabled');
                scanBtnText.textContent = '重新搜索';

                if (error.name === 'NotFoundError') {
                    statusIcon.innerHTML = ICONS.bluetooth;
                    statusTitle.textContent = '准备配网';
                    statusDesc.textContent = '未选择设备，点击按钮重新扫描';
                } else {
                    statusIcon.innerHTML = ICONS.x;
                    statusTitle.textContent = '扫描失败';
                    statusDesc.textContent = error.message;
                }
            }
        }

        scanBtn.addEventListener('click', startScan);

        // ==================== 显示设备 ====================
        function showDevice(device) {
            deviceSection.style.display = 'block';
            deviceList.innerHTML = '';

            const item = document.createElement('div');
            item.className = 'device-item';
            item.innerHTML = `
                <div class="device-icon">${ICONS.device}</div>
                <div class="device-info">
                    <div class="device-name">${device.name}</div>
                    <div class="device-id">${device.id}</div>
                </div>
                <div class="device-status">连接</div>
            `;

            item.addEventListener('click', () => connectDevice(item));
            deviceList.appendChild(item);
            updateStep(2);
        }

        // ==================== 连接设备 ====================
        async function connectDevice(element) {
            if (!bleDevice) return;

            try {
                element.querySelector('.device-status').textContent = '连接中...';
                statusIcon.innerHTML = ICONS.link;
                statusTitle.textContent = '正在连接';
                statusDesc.textContent = `连接至 ${bleDevice.name}...`;

                bleServer = await bleDevice.gatt.connect();
                bleService = await bleServer.getPrimaryService(BLE_CONFIG.SERVICE_1112_UUID);
                char4444 = await bleService.getCharacteristic(BLE_CONFIG.CHAR_4444_UUID);

                await char4444.startNotifications();
                char4444.addEventListener('characteristicvaluechanged', (event) => {
                    const value = new TextDecoder().decode(event.target.value);
                    if (value === "SCAN_DONE") {
                        log('扫描完成', 'success');
                        configBtn.textContent = '重新扫描 Wi-Fi';
                        configBtn.classList.remove('disabled');
                    } else if (value === "SCAN_FAIL") {
                        log('扫描失败', 'error');
                        configBtn.textContent = '扫描失败, 重试';
                        configBtn.classList.remove('disabled');
                    } else {
                        const [ssid, rssi] = value.split(':');
                        addWifiItem(ssid, rssi);
                    }
                });

                configBtn.onclick = async () => {
                    try {
                        deviceList.innerHTML = '';
                        const encoder = new TextEncoder();
                        await char4444.writeValue(encoder.encode('SCAN_WIFI'));
                        configBtn.textContent = '扫描中...';
                        configBtn.classList.add('disabled');
                    } catch (err) {
                        alert('发送失败: ' + err.message);
                        configBtn.textContent = '重试扫描';
                        configBtn.classList.remove('disabled');
                    }
                };

                isConnected = true;
                element.classList.add('connected');
                element.querySelector('.device-status').textContent = '已连接';

                statusIcon.innerHTML = ICONS.check;
                statusTitle.textContent = '配对成功';
                statusDesc.textContent = `设备已就绪，请扫描周围网络`;

                wifiSection.style.display = 'block';
                updateStep(3);
                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

            } catch (error) {
                element.querySelector('.device-status').textContent = '失败';
                statusIcon.innerHTML = ICONS.x;
                statusTitle.textContent = '连接失败';
                statusDesc.textContent = error.message;
                if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect();
            }
        }

        // ==================== 断开逻辑 ====================
        function onDisconnected() {
            isConnected = false;
            bleServer = null; bleService = null; char4444 = null;
            
            statusIcon.innerHTML = ICONS.bluetooth;
            statusTitle.textContent = '已断开';
            statusDesc.textContent = '设备连接已丢失';
            wifiSection.style.display = 'none';

            document.querySelectorAll('.device-item').forEach(item => {
                item.classList.remove('connected');
                item.querySelector('.device-status').textContent = '点击重连';
            });
        }

        async function disconnectDevice() {
            if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect();
        }

        // ==================== 更新步骤 ====================
        function updateStep(step) {
            for (let i = 1; i <= 3; i++) {
                const dot = document.getElementById(`step${i}`);
                dot.className = 'step-dot';
                if (i < step) dot.classList.add('done');
                if (i === step) dot.classList.add('active');
            }
        }

        // ==================== 弹窗逻辑 ====================
        function closeModal() {
            passwordModal.classList.remove('show');
            setTimeout(() => { passwordModal.style.display = 'none'; }, 300);
        }

        cancelPwdBtn.addEventListener('click', closeModal);
        passwordModal.addEventListener('click', (e) => {
            if (e.target === passwordModal) closeModal();
        });

        confirmPwdBtn.addEventListener('click', async () => {
            const password = wifiPassword.value;
            if (!char4444) return alert('蓝牙未连接！');

            try {
                const payloadStr = JSON.stringify({ ssid: selectedSsid, pwd: password });
                const encoder = new TextEncoder();
                
                confirmPwdBtn.textContent = '配置中...';
                await char4444.writeValue(encoder.encode(payloadStr));

                alert(`配置已发送\nSSID: ${selectedSsid}`);
                closeModal();
                confirmPwdBtn.textContent = '发送';

            } catch (error) {
                alert('发送失败: ' + error.message);
                confirmPwdBtn.textContent = '发送';
            }
        });
    </script>
</body>
</html>
