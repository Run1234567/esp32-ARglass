<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR GLASS - 视频录像</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --text-tertiary: rgba(255, 255, 255, 0.3);
            --accent-color: #0a84ff;
            --danger-color: #ff453a;
            --danger-hover: rgba(255, 69, 58, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            /* 强制浏览器原生组件使用暗黑皮肤 */
            color-scheme: dark; 
        }

        /* ========== PC端定制高科技滚动条 ========== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ========== 极简环境光 ========== */
        .ambient-glow {
            position: fixed;
            top: -10%;
            left: 50%;
            width: 60vw;
            height: 60vw;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(10, 132, 255, 0.06) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        /* ========== 顶部导航栏 ========== */
        .header {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
        }

        .header-title {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .back-btn {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            color: var(--text-primary);
            text-decoration: none;
            transition: background 0.3s ease;
        }

        .back-btn:active {
            background: var(--surface-hover);
        }

        .back-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
        }

        .nav-placeholder {
            width: 38px;
        }

        /* ========== 视频流式瀑布网格布局 ========== */
        .content {
            position: relative;
            z-index: 1;
            padding: 2rem 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /* ========== 视频网格卡片 ========== */
        .video-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            animation: fadeInUp 0.4s ease backwards;
        }

        @media (hover: hover) {
            .video-card:hover {
                transform: translateY(-4px);
                background: var(--surface-hover);
                border-color: rgba(255, 255, 255, 0.15);
                box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .video-info {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .video-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.3px;
        }

        /* 精致胶囊数据标签 */
        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            align-items: center;
        }

        .meta-badge {
            font-size: 0.7rem;
            font-weight: 500;
            padding: 0.2rem 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border-radius: 6px;
            white-space: nowrap;
        }

        /* 删除按钮 */
        .delete-btn {
            background: transparent;
            color: var(--danger-color);
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .delete-btn:hover, .delete-btn:active {
            background: var(--danger-hover);
            border-color: rgba(255, 69, 58, 0.3);
        }

        .delete-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 播放器包装 */
        .player-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.05);
            aspect-ratio: 16 / 9;
        }

        .video-player {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            outline: none;
        }

        /* 全局高级骨骼屏与空状态 */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-secondary);
            padding: 5rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            font-size: 0.9rem;
            animation: fadeInUp 0.4s ease both;
        }

        .empty-state svg {
            width: 42px;
            height: 42px;
            stroke: var(--text-tertiary);
            stroke-width: 1.5;
            fill: none;
        }

        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }
        .spin-icon {
            animation: spin 2s linear infinite;
        }

        @media (max-width: 480px) {
            .content {
                grid-template-columns: 1fr;
                padding: 1.5rem 1rem;
                gap: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="header">
        <a href="menu.html" class="back-btn">
            <svg viewBox="0 0 24 24">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>
        <div class="header-title">JARVIS 视频档案库</div>
        <div class="nav-placeholder"></div>
    </div>

    <div class="content" id="video-list">
        <div class="empty-state">
            <svg class="spin-icon" viewBox="0 0 24 24">
                <line x1="12" y1="2" x2="12" y2="6"></line>
                <line x1="12" y1="18" x2="12" y2="22"></line>
                <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                <line x1="2" y1="12" x2="6" y2="12"></line>
                <line x1="18" y1="12" x2="22" y2="12"></line>
                <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
            </svg>
            <p style="letter-spacing: 0.5px;">正在安全同步量子加密视界...</p>
        </div>
    </div>

    <script>
        // 自动调用 Flask API 获取视频列表
        function loadVideos() {
            fetch('/api/get_videos')
                .then(response => response.json())
                .then(res => {
                    const listContainer = document.getElementById('video-list');
                    if (res.status === 'success' && res.data && res.data.length > 0) {
                        listContainer.innerHTML = ''; // 清空提示

                        res.data.forEach((video, index) => {
                            const delay = index * 0.08; // 极其流畅的交错瀑布进场耗时
                            const fileSizeMB = (video.file_size_kb / 1024).toFixed(2);

                            // 直接使用数据库中的 file_path 字段（已包含完整路径）
                            const videoSrc = video.file_path;

                            // 映射生成大厂级高阶卡片组件HTML结构（保持原始变量注入完好）
                            const cardHtml = `
                                <div class="video-card" style="animation-delay: ${delay}s">
                                    <div class="video-header">
                                        <div class="video-info">
                                            <div class="video-title">JARVIS_RECORD #${video.id}</div>
                                            <div class="badge-container">
                                                <span class="meta-badge">${video.created_at}</span>
                                                <span class="meta-badge" style="color: var(--accent-color);">${fileSizeMB} MB</span>
                                            </div>
                                        </div>
                                        <button class="delete-btn" onclick="deleteVideo(${video.id})" title="彻底删除档案">
                                            <svg viewBox="0 0 24 24">
                                                <polyline points="3 6 5 6 21 6"></polyline>
                                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                                <line x1="14" y1="11" x2="14" y2="17"></line>
                                            </svg>
                                        </button>
                                    </div>
                                    <div class="player-wrapper">
                                        <video class="video-player" controls preload="metadata" playsinline>
                                            <source src="${videoSrc}" type="video/mp4">
                                            当前浏览器不支持视频播放。
                                        </video>
                                    </div>
                                </div>
                            `;
                            listContainer.insertAdjacentHTML('beforeend', cardHtml);
                        });
                    } else {
                        listContainer.innerHTML = `
                            <div class="empty-state">
                                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                    <circle cx="12" cy="13" r="4"></circle>
                                </svg>
                                <p>暂无空间录像记录，请使用智能眼镜开启第一视角拍摄</p>
                            </div>
                        `;
                    }
                })
                .catch(err => {
                    console.error('获取视频失败:', err);
                    document.getElementById('video-list').innerHTML = `
                        <div class="empty-state" style="color: var(--danger-color);">
                            <svg viewBox="0 0 24 24" style="stroke: var(--danger-color)">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="8" x2="12" y2="12"></line>
                                <line x1="12" y1="16" x2="12.01" y2="16"></line>
                            </svg>
                            <p>边缘节点连接异常，请检查网络网关状态。</p>
                        </div>
                    `;
                });
        }

        // 调用后台删除视频接口
        function deleteVideo(videoId) {
            if (!confirm('确定要彻底删除这段录像吗？')) return;

            fetch(`/api/delete_video/${videoId}`, { method: 'POST' })
                .then(response => response.json())
                .then(res => {
                    if (res.status === 'success') {
                        loadVideos(); // 删除成功后自动刷新列表
                    } else {
                        alert(res.message || '删除失败');
                    }
                })
                .catch(err => alert('网络错误，删除失败'));
        }

        // 页面打开时自动加载
        window.onload = loadVideos;
    </script>
</body>
</html>
