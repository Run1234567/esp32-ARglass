<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - AR GLASS</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --text-tertiary: rgba(255, 255, 255, 0.3);
            --primary-action: #ffffff;
            --primary-action-text: #000000;
            --danger-color: #ff453a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg-color);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-primary);
        }

        /* ========== 极简环境光 ========== */
        .ambient-glow {
            position: fixed;
            top: 20%;
            left: 50%;
            width: 80vw;
            height: 80vw;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        /* ========== 主容器 ========== */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* ========== 品牌 Logo ========== */
        .brand-header {
            margin-bottom: 2.5rem;
            text-align: center;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .brand-icon:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 10px 20px rgba(255,255,255,0.05);
        }

        .brand-icon svg {
            width: 32px;
            height: 32px;
            stroke: currentColor;
            stroke-width: 1.2;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 0.3rem;
            transition: font-size 0.3s ease;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* ========== 登录毛玻璃卡片 ========== */
        .login-card {
            width: 100%;
            max-width: 340px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-input {
            width: 100%;
            padding: 1.1rem 1.2rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        /* PC端鼠标悬停输入框的交互反馈 */
        .form-input:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.5);
        }

        .form-input:focus {
            background: rgba(0, 0, 0, 0.7);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
        }

        .form-input::placeholder {
            color: var(--text-tertiary);
        }

        .form-input.error {
            border-color: rgba(255, 69, 58, 0.5);
            background: rgba(255, 69, 58, 0.05);
            animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* ========== 登录按钮 (Apple Style) ========== */
        .login-btn {
            width: 100%;
            padding: 1.1rem;
            margin-top: 1rem;
            background: var(--primary-action);
            color: var(--primary-action-text);
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* PC端按钮悬停微交互 */
        .login-btn:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.15);
        }

        .login-btn:active {
            transform: scale(0.96) translateY(0);
            box-shadow: none;
            opacity: 0.9;
        }

        .login-btn.loading {
            pointer-events: none;
            opacity: 0.8;
            transform: none;
            box-shadow: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .login-btn.loading .spinner { display: block; }
        .login-btn.loading span { display: none; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========== 错误提示 ========== */
        .error-msg {
            text-align: center;
            font-size: 0.8rem;
            color: var(--danger-color);
            margin-top: 1.2rem;
            min-height: 1.2rem;
            opacity: 0;
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }

        .error-msg.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ========== 底部信息 ========== */
        .footer {
            position: absolute;
            bottom: 2.5rem;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .footer-text {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            letter-spacing: 1px;
        }

        /* ========== 极简成功弹窗 ========== */
        .success-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .success-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .success-card {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .success-overlay.show .success-card {
            transform: scale(1);
        }

        .success-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(50, 215, 75, 0.15);
            color: var(--success-color, #32d74b);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-icon svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
        }

        .success-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* =========================================
           🖥️ PC 端专属适配 (Media Queries)
           当屏幕宽度大于 768px 时，自动触发大屏布局
           ========================================= */
        @media (min-width: 768px) {
            /* 调整环境光晕：电脑上光晕不能太大，要收束在中间 */
            .ambient-glow {
                width: 40vw;
                height: 40vw;
                top: 50%;
                transform: translate(-50%, -50%);
                background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 60%);
            }

            /* 登录卡片放大，增加呼吸感 */
            .login-card {
                max-width: 420px;
                padding: 3.5rem 3rem;
                border-radius: 28px;
            }

            /* 字体随之放大 */
            .brand-title {
                font-size: 1.8rem;
            }

            .brand-subtitle {
                font-size: 0.85rem;
            }

            .form-input {
                font-size: 1rem;
                padding: 1.2rem 1.4rem;
            }

            .login-btn {
                font-size: 1.05rem;
                padding: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <main class="container">
        <div class="brand-header">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12h3l3 -9l6 18l3 -9h5"></path>
                </svg>
            </div>
            <div class="brand-title">AR GLASS</div>
            <div class="brand-subtitle">Control Center</div>
        </div>

        <form class="login-card" id="loginForm">
            <div class="form-group">
                <input type="text" class="form-input" id="username" placeholder="输入控制中心账号" autocomplete="off" spellcheck="false">
            </div>

            <div class="form-group">
                <input type="password" class="form-input" id="password" placeholder="输入密码">
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <div class="spinner"></div>
                <span>登录</span>
            </button>

            <div class="error-msg" id="errorMsg">账号或密码错误</div>
        </form>

        <div class="footer">
            <div class="footer-text">Secure Access · AR OS</div>
        </div>
    </main>

    <div class="success-overlay" id="successOverlay">
        <div class="success-card">
            <div class="success-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <div class="success-text">验证成功</div>
        </div>
    </div>

    <script>
        const VALID_USERNAME = 'RUN';
        const VALID_PASSWORD = '88888888';

        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const successOverlay = document.getElementById('successOverlay');

        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'menu.html';
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            usernameInput.classList.remove('error');
            passwordInput.classList.remove('error');
            errorMsg.classList.remove('show');

            if (!username || !password) {
                if (!username) usernameInput.classList.add('error');
                if (!password) passwordInput.classList.add('error');
                errorMsg.textContent = '请输入完整的账号和密码';
                errorMsg.classList.add('show');
                return;
            }

            loginBtn.classList.add('loading');

            await new Promise(resolve => setTimeout(resolve, 800));

            if (username === VALID_USERNAME && password === VALID_PASSWORD) {
                sessionStorage.setItem('isLoggedIn', 'true');
                successOverlay.classList.add('show');
                setTimeout(() => {
                    window.location.href = 'menu.html';
                }, 1000);
            } else {
                loginBtn.classList.remove('loading');
                usernameInput.classList.add('error');
                passwordInput.classList.add('error');
                errorMsg.textContent = '账号或密码不正确';
                errorMsg.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
            }
        });

        usernameInput.addEventListener('input', () => {
            usernameInput.classList.remove('error');
            errorMsg.classList.remove('show');
        });

        passwordInput.addEventListener('input', () => {
            passwordInput.classList.remove('error');
            errorMsg.classList.remove('show');
        });
    </script>
</body>
</html>
